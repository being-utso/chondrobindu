      --bg-background: #EDEAE0;

      --bg-recessed: #E5E1D5;
      --text-primary: #1F2A3A;
      --text-muted: #5A6578;
      --primary: #2F4A6D;
      --secondary: #A5673F;
      --success: #3B7A57;
    }
    .dark,
    [data-theme='dark'] {
      --bg-background: #171C24;
      --bg-surface: #202733;
      --border-surface: #2E3846;
      --bg-recessed: #13171E;
      --text-primary: #EDEAE0;

      --primary: #8FA8C8;

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme='light']) {
        --bg-background: #171C24;
        --bg-surface: #202733;
        --border-surface: #2E3846;
        --bg-recessed: #13171E;
        --text-primary: #EDEAE0;

  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #171C24;
      background-size: 100% 100%;
      font-family: var(--font-sans);
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <picture id="splash">

  </picture>
